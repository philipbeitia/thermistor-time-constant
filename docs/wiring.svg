<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 460" width="860" height="460" font-family="Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <style>
      .hole { fill:#3b3b3b; }
      .wire { fill:none; stroke-width:4; stroke-linecap:round; }
    </style>
  </defs>
  <rect width="860" height="460" fill="#ffffff"/>
  <text x="20" y="28" font-size="16" font-weight="bold" fill="#222">Wiring diagram — thermistor time-constant rig</text>

  <!-- ================= Arduino Uno ================= -->
  <rect x="30" y="70" width="280" height="300" rx="10" fill="#2b70b8" stroke="#1b4a7a" stroke-width="2"/>
  <text x="170" y="110" text-anchor="middle" fill="#fff" font-size="18" font-weight="bold">ARDUINO UNO</text>
  <!-- USB -->
  <rect x="14" y="110" width="30" height="40" fill="#c9c9c9" stroke="#777" stroke-width="1.5"/>
  <text x="14" y="62" fill="#333" font-size="11">USB → laptop</text>
  <!-- chip -->
  <rect x="120" y="190" width="120" height="40" fill="#1e1e1e"/>
  <text x="180" y="214" text-anchor="middle" fill="#bbb" font-size="10">ATmega328P</text>
  <!-- top digital header (not used) -->
  <rect x="100" y="78" width="190" height="18" fill="#1e1e1e"/>
  <text x="195" y="128" text-anchor="middle" fill="#dbe8f5" font-size="10">digital pins (not used)</text>

  <!-- bottom POWER header -->
  <rect x="70" y="332" width="120" height="30" fill="#1e1e1e"/>
  <g fill="#8a8a8a">
    <rect x="76" y="340" width="8" height="14"/><rect x="94" y="340" width="8" height="14"/>
    <rect x="112" y="340" width="8" height="14"/><rect x="130" y="340" width="8" height="14"/>
    <rect x="148" y="340" width="8" height="14"/><rect x="166" y="340" width="8" height="14"/>
  </g>
  <text x="130" y="326" text-anchor="middle" fill="#fff" font-size="10">POWER</text>
  <text x="116" y="386" text-anchor="middle" fill="#222" font-size="11" font-weight="bold">5V</text>
  <text x="152" y="386" text-anchor="middle" fill="#222" font-size="11" font-weight="bold">GND</text>

  <!-- bottom ANALOG header -->
  <rect x="200" y="332" width="100" height="30" fill="#1e1e1e"/>
  <g fill="#8a8a8a">
    <rect x="206" y="340" width="8" height="14"/><rect x="222" y="340" width="8" height="14"/>
    <rect x="238" y="340" width="8" height="14"/><rect x="254" y="340" width="8" height="14"/>
    <rect x="270" y="340" width="8" height="14"/><rect x="286" y="340" width="8" height="14"/>
  </g>
  <text x="250" y="326" text-anchor="middle" fill="#fff" font-size="10">ANALOG IN</text>
  <text x="210" y="386" text-anchor="middle" fill="#222" font-size="11" font-weight="bold">A0</text>

  <!-- ================= Breadboard (half) ================= -->
  <rect x="400" y="100" width="200" height="270" rx="6" fill="#f2ead8" stroke="#bfb49a" stroke-width="2"/>
  <text x="500" y="92" text-anchor="middle" fill="#555" font-size="11">breadboard — each ROW of 5 holes is connected</text>
  <!-- row numbers -->
  <g fill="#777" font-size="10" text-anchor="start">
    <text x="578" y="129">1</text><text x="578" y="151">2</text><text x="578" y="174">3</text><text x="578" y="196">4</text>
    <text x="578" y="219">5</text><text x="578" y="241">6</text><text x="578" y="264">7</text><text x="578" y="286">8</text>
    <text x="578" y="309">9</text><text x="578" y="331">10</text>
  </g>
  <!-- holes: 10 rows × 5 columns  x = 440,470,500,530,560 ; y = 125 + 22.5*(r-1) -->
  <g class="hole">
    <circle cx="440" cy="125" r="3"/><circle cx="470" cy="125" r="3"/><circle cx="500" cy="125" r="3"/><circle cx="530" cy="125" r="3"/><circle cx="560" cy="125" r="3"/>
    <circle cx="440" cy="147.5" r="3"/><circle cx="470" cy="147.5" r="3"/><circle cx="500" cy="147.5" r="3"/><circle cx="530" cy="147.5" r="3"/><circle cx="560" cy="147.5" r="3"/>
    <circle cx="440" cy="170" r="3"/><circle cx="470" cy="170" r="3"/><circle cx="500" cy="170" r="3"/><circle cx="530" cy="170" r="3"/><circle cx="560" cy="170" r="3"/>
    <circle cx="440" cy="192.5" r="3"/><circle cx="470" cy="192.5" r="3"/><circle cx="500" cy="192.5" r="3"/><circle cx="530" cy="192.5" r="3"/><circle cx="560" cy="192.5" r="3"/>
    <circle cx="440" cy="215" r="3"/><circle cx="470" cy="215" r="3"/><circle cx="500" cy="215" r="3"/><circle cx="530" cy="215" r="3"/><circle cx="560" cy="215" r="3"/>
    <circle cx="440" cy="237.5" r="3"/><circle cx="470" cy="237.5" r="3"/><circle cx="500" cy="237.5" r="3"/><circle cx="530" cy="237.5" r="3"/><circle cx="560" cy="237.5" r="3"/>
    <circle cx="440" cy="260" r="3"/><circle cx="470" cy="260" r="3"/><circle cx="500" cy="260" r="3"/><circle cx="530" cy="260" r="3"/><circle cx="560" cy="260" r="3"/>
    <circle cx="440" cy="282.5" r="3"/><circle cx="470" cy="282.5" r="3"/><circle cx="500" cy="282.5" r="3"/><circle cx="530" cy="282.5" r="3"/><circle cx="560" cy="282.5" r="3"/>
    <circle cx="440" cy="305" r="3"/><circle cx="470" cy="305" r="3"/><circle cx="500" cy="305" r="3"/><circle cx="530" cy="305" r="3"/><circle cx="560" cy="305" r="3"/>
    <circle cx="440" cy="327.5" r="3"/><circle cx="470" cy="327.5" r="3"/><circle cx="500" cy="327.5" r="3"/><circle cx="530" cy="327.5" r="3"/><circle cx="560" cy="327.5" r="3"/>
  </g>

  <!-- ================= R1: row 2 → row 5 in column x=470 ================= -->
  <line x1="470" y1="147.5" x2="470" y2="215" stroke="#888" stroke-width="2"/>
  <rect x="462" y="162" width="16" height="38" rx="4" fill="#e8d7b0" stroke="#8a7a55" stroke-width="1.5"/>
  <rect x="462" y="168" width="16" height="4" fill="#8b4513"/>   <!-- brown -->
  <rect x="462" y="175" width="16" height="4" fill="#111"/>      <!-- black -->
  <rect x="462" y="182" width="16" height="4" fill="#e8822a"/>   <!-- orange -->
  <rect x="462" y="191" width="16" height="4" fill="#c9a84c"/>   <!-- gold -->
  <text x="486" y="186" fill="#222" font-size="11">R1 10 kΩ</text>

  <!-- ================= NTC probe: 2-wire cable from rows 5 and 8 (column x=530) to a ring-lug sensor in the cup ================= -->
  <path d="M530 215 C 600 215, 640 250, 688 296" fill="none" stroke="#333" stroke-width="2.5"/>
  <path d="M530 282.5 C 600 282.5, 650 288, 694 300" fill="none" stroke="#333" stroke-width="2.5"/>
  <text x="705" y="436" text-anchor="middle" fill="#222" font-size="11">NTC probe: thermistor sealed in a metal ring lug, 2-wire cable</text>

  <!-- cup of warm water -->
  <path d="M640 270 L 650 400 L 760 400 L 770 270" fill="none" stroke="#333" stroke-width="2"/>
  <path d="M646 300 L 654 396 L 756 396 L 764 300 Z" fill="#cfe4f7" opacity="0.8"/>
  <path d="M689 296 L 703 300 L 712 322 A 9 9 0 1 1 698 328 Z" fill="#b8b8b8" stroke="#555" stroke-width="1.5"/>
  <circle cx="705" cy="325" r="3.5" fill="#cfe4f7" stroke="#555" stroke-width="1.2"/>
  <text x="705" y="420" text-anchor="middle" fill="#222" font-size="11">warm water ≈ 40 °C, stirred</text>
  <!-- reference thermometer -->
  <line x1="740" y1="240" x2="740" y2="385" stroke="#555" stroke-width="3"/>
  <circle cx="740" cy="386" r="5" fill="#c33"/>
  <rect x="733" y="226" width="14" height="18" fill="#eee" stroke="#555" stroke-width="1"/>
  <text x="754" y="236" fill="#222" font-size="11">reference</text>
  <text x="754" y="249" fill="#222" font-size="11">thermometer (TP101)</text>

  <!-- ================= wires: Arduino header → breadboard column x=440 ================= -->
  <!-- red: 5V → row 2 -->
  <path class="wire" stroke="#d62728" d="M116 356 C 116 450, 340 147.5, 440 147.5"/>
  <!-- black: GND → row 8 -->
  <path class="wire" stroke="#222" d="M152 356 C 152 430, 350 282.5, 440 282.5"/>
  <!-- yellow: A0 → row 5 -->
  <path class="wire" stroke="#e6b800" d="M210 356 C 210 410, 350 215, 440 215"/>

  <!-- legend -->
  <g font-size="11" fill="#222">
    <line x1="30" y1="410" x2="60" y2="410" stroke="#d62728" stroke-width="4" stroke-linecap="round"/><text x="68" y="414">5V → row 2 (top of R1)</text>
    <line x1="30" y1="430" x2="60" y2="430" stroke="#e6b800" stroke-width="4" stroke-linecap="round"/><text x="68" y="434">A0 → row 5 (R1 meets thermistor)</text>
    <line x1="30" y1="450" x2="60" y2="450" stroke="#222" stroke-width="4" stroke-linecap="round"/><text x="68" y="454">GND → row 8 (other thermistor leg)</text>
  </g>
</svg>
